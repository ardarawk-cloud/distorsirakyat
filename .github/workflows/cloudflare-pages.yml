name: Distorsi Rakyat - Check and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Verify public files
        shell: bash
        run: |
          test -s index.html && test -s assets/styles.css && test -s assets/app.js
          ! grep -riE 'Pekak Gunung|I Made Regog|I Gede Regig|keluarga Arda' index.html assets README.md
      - name: Prepare production files
        shell: bash
        run: |
          mkdir -p dist/assets
          cp index.html 404.html robots.txt sitemap.xml _headers dist/
          cp assets/*.css assets/*.js assets/*.svg dist/assets/
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets belum disetel. Pemeriksaan tetap jalan; deploy dilewati."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to existing Cloudflare Pages project
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'distorsi-rakyat' }} --branch=main
